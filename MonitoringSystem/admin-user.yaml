# =====================================================================
# LEGACY / DEPRECATED (issue #4). monitoring.sh no longer applies this file.
# It is kept only as a record of the original lab setup and so that earlier
# installs can be revoked with: kubectl delete -f MonitoringSystem/admin-user.yaml
#
# WARNING: this admin-user binds the built-in cluster-admin ClusterRole.
# Its token gives FULL control of the cluster (read/write every namespace,
# read every Secret, create privileged pods). The Secret below is a
# long-lived token that does not expire. Anyone who obtains it owns the cluster.
# Do not apply it. For the UI use MonitoringSystem/headlamp/ and a short-lived
# read-only token (kubectl -n headlamp create token headlamp-viewer --duration=30m).
# =====================================================================
# admin-user Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-user
  namespace: kubernetes-dashboard
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: admin-user
  namespace: kubernetes-dashboard
  annotations:
    kubernetes.io/service-account.name: admin-user
---
# admin-user Cluster Rolebinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-user
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: admin-user
  namespace: kubernetes-dashboard
